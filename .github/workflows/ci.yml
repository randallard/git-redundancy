name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast gates — run on every push/PR (ADR-0011). Seconds; the primary feedback loop.
  # `timeout-minutes` on every job caps the blast radius of a hang. GitHub's
  # default is 6 HOURS; observed warm runtimes here are 13-38s, so these ceilings
  # are ~15-30x headroom and will only ever trip on a genuine wedge.
  gates:
    name: fast gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      # `--locked` on every dependency-resolving command (ADR-0004 CM: pinned
      # Cargo.lock). Without it CI silently re-resolves, so a lockfile that no
      # longer satisfies the manifest passes green. `cargo fmt` is excluded — it
      # rejects the flag and resolves nothing.
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked --all
      - name: cargo-deny (licenses, bans, sources, advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Proofs — separate job, every push/PR (ADR-0011). The Kani bundle + nightly are
  # cached on ~/.kani, so a warm run is just solve time (our harnesses are tiny).
  proofs:
    name: kani proofs
    runs-on: ubuntu-latest
    # Higher ceiling than the other jobs: a cold cache pays the Kani/CBMC bundle
    # download. Solve time itself is trivial (integer decision logic, no loops,
    # no unwind bounds needed) — 35s observed warm.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: cache Kani toolchain
        uses: actions/cache@v4
        with:
          path: ~/.kani
          key: kani-0.67.0-${{ runner.os }}
      - name: run Kani on the core classifiers
        uses: model-checking/kani-github-action@v1
        with:
          kani-version: '0.67.0'
          args: '-p git-redundancy-core'

  # Coverage gate — TIERED BY TESTABILITY (ADR-0023, supersedes the ADR-0004-era
  # single blended floor). The old 58% stopgap averaged a near-fully-covered pure
  # core against SSH orchestration that cannot be tested hermetically, and so
  # described neither. Measured instead, the *testable* surface was already at
  # 84% — the debt was a denominator problem, not a quality problem.
  #
  # The exclusion list in gate 2 is EXHAUSTIVE AND CLOSED: those three files by
  # name, no globs. Adding a file to it requires a new ADR superseding 0023 —
  # that is what stops the exclusion becoming a place to hide untested code.
  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Gate 1 — the ADR-0002 pure core; also the proptest/Kani target. Should
      # stay near-total. Measured 96.37% on 2026-08-05.
      - name: coverage — pure core (floor 95%)
        run: cargo llvm-cov --locked -p git-redundancy-core --fail-under-lines 95
      # Gate 2 — the real quality gate: everything a hermetic test can reach.
      # STRICTER than the 70% that predated the stopgap. Measured 84.42%.
      - name: coverage — testable surface, network shell excluded (floor 80%)
        run: |
          cargo llvm-cov --locked --workspace --fail-under-lines 80 \
            --ignore-filename-regex '(cli/src/lifecycle\.rs|io/src/server\.rs|io/src/git\.rs)'
      # Gate 3 — reported, NOT gated. Keeps the blended trend visible without any
      # number being load-bearing. Measured 65.51%.
      - name: coverage — whole workspace (reported, not gated)
        run: cargo llvm-cov --locked --workspace --summary-only

  # Supply chain (ADR-0004, SR/CM) — dependency review (cargo-vet) and an SBOM.
  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-vet,cargo-cyclonedx
      - name: cargo-vet (audited/exempted dependencies)
        run: cargo vet --locked
      - name: generate SBOM (CycloneDX)
        run: cargo cyclonedx --format json --all
      - name: upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "**/*.cdx.json"
          if-no-files-found: warn
